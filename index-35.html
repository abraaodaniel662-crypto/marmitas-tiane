<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marmitas da Tiane · Controle de vendas</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#F4F6FA;--surface:#fff;--ink:#0F1B2D;--muted:#5A6678;--line:#DCE2EC;--green:#0B2545;--chili:#E8590C;--sun:#FF9F45;--r:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}h1,h2,.brand,.big{font-family:"Bricolage Grotesque",sans-serif}.wrap{max-width:720px;margin:auto;padding:0 16px 40px}.hero{background:var(--green);color:#fff;border-radius:0 0 28px 28px;padding:14px 20px 30px}.hero-in{max-width:720px;margin:auto;position:relative}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}.menu{border:0;background:#ffffff22;width:38px;height:38px;border-radius:12px;cursor:pointer;color:#fff}.hero-row{display:flex;justify-content:space-between;align-items:center;gap:10px}.hero h1{font-size:24px;margin:5px 0}.hi{color:#c9d6ea;margin:8px 0}.today{display:flex;gap:22px;flex-wrap:wrap}.big{font-size:32px;font-weight:800;color:var(--sun);line-height:1}.today small,.goal small{display:block;color:#c9d6ea;font-size:13px}.lunch{width:125px}.goal{margin-top:12px;max-width:270px}.gb{height:10px;background:#ffffff25;border-radius:20px;overflow:hidden}.gb i{display:block;height:100%;background:var(--sun);width:0}.drop{position:absolute;top:52px;left:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:220px;z-index:20;box-shadow:0 8px 24px #0004}.drop button{display:block;width:100%;padding:12px;border:0;background:none;color:var(--ink);text-align:left;border-radius:10px;font-size:16px}.drop button[aria-current=true]{background:var(--sun);font-weight:700}.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:999px;margin:-20px 0 18px;position:relative;z-index:5}.tabs button{flex:1;border:0;background:none;color:var(--muted);font-weight:700;padding:12px;border-radius:999px;cursor:pointer}.tabs button[aria-selected=true]{background:var(--chili);color:#fff}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}h2{font-size:22px;margin:0 0 12px}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;color:var(--muted)}input,select{width:100%;margin-top:4px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:17px}.full{grid-column:1/-1}.go{border:0;background:var(--green);color:#fff;font-weight:700;font-size:17px;padding:14px;border-radius:14px;cursor:pointer}.row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);gap:10px}.row:first-child{border-top:0}.row span,.empty{color:var(--muted);font-size:14px}.del{border:0;background:none;color:var(--chili);font-weight:700;cursor:pointer;padding:8px}.seg{display:flex;gap:8px;margin-bottom:14px}.seg button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px;border-radius:12px;font-weight:700}.seg button[aria-pressed=true]{background:var(--sun);border-color:var(--sun)}.mp{display:flex;gap:8px;margin-bottom:14px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}.kpi{border-radius:var(--r);padding:16px;background:var(--green);color:#fff}.kpi:nth-child(2){background:var(--chili)}.kpi:nth-child(3){background:var(--sun);color:#15211b}.kpi:nth-child(3) .big{color:#15211b}.kpi .big{font-size:27px;color:#fff}.chart{display:flex;align-items:flex-end;gap:4px;height:180px;overflow-x:auto}.col{flex:1;min-width:12px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px;color:var(--muted)}.bar{width:100%;background:var(--chili);border-radius:6px 6px 0 0;min-height:2px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 12px;border-radius:99px}.pay{border:1px solid var(--chili);color:var(--chili);background:none;border-radius:99px;padding:4px 10px;font-weight:700}.pay.ok{background:#2e9e5b;border-color:#2e9e5b;color:#fff}.ck{width:22px;height:22px;margin:0;accent-color:var(--chili)}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,30px);background:var(--green);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:99}.toast.on{opacity:1;transform:translate(-50%,0)}[hidden]{display:none!important}@media(min-width:900px){.wrap,.hero-in{max-width:1120px}.hero{padding:18px 32px 52px}.hero h1{font-size:36px}.lunch{width:210px}.tabs{max-width:480px;margin:-26px auto 24px}#p1:not([hidden]){display:grid;grid-template-columns:5fr 6fr;gap:20px}.kpis{grid-template-columns:repeat(4,1fr)}.chart{height:280px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-in"><div class="brand"><button class="menu" id="mb" aria-label="Menu">☰</button><span>🍱</span>Marmitas da Tiane</div><nav class="drop" id="dp" hidden><button data-n="1">Lançar marmitas</button><button data-n="2">Totais</button><button data-n="3">Clientes e resumo</button></nav><div class="hero-row"><div><p class="hi" id="hi"></p><h1>Cada marmita conta.</h1><div class="today"><div><span class="big" id="hq">0</span><small>marmitas hoje</small></div><div><span class="big" id="hv">R$ 0,00</span><small>faturado na semana</small></div></div><div class="goal"><div class="gb"><i id="gi"></i></div><small id="gt"></small></div></div><div class="lunch">🍱</div></div></div></header>
<main class="wrap">
<div class="tabs" role="tablist"><button id="t1" aria-selected="true" type="button">Lançar marmitas</button><button id="t2" aria-selected="false" type="button">Totais</button></div>
<section id="p1"><div class="card"><h2>Novo lançamento</h2><form id="f"><div class="full"><label>Cliente<input id="c" list="cl" placeholder="Ex.: Empresa A" required></label><datalist id="cl"></datalist><div class="chips" id="chips"></div></div><label>Quantidade<input id="q" type="number" min="1" step="1" placeholder="50" required></label><label>Valor de cada (R$)<input id="v" type="number" min="0.01" step="0.01" placeholder="15,00" required></label><label class="full">Data<input id="d" type="date" required></label><label class="full">Observação<input id="o" maxlength="80" placeholder="Ex.: sem feijão, entrega às 11h"></label><button class="go full" type="submit">Lançar marmitas</button></form></div><div class="card"><h2>Lançado nesta semana</h2><div id="list"></div></div></section>
<div id="ctl" hidden><div class="seg" id="seg"><button data-p="w" aria-pressed="true">Semana</button><button data-p="m" aria-pressed="false">Mês</button><button data-p="a" aria-pressed="false">Tudo</button></div><div class="mp" id="mp" hidden><select id="sm"></select><select id="sy"></select></div></div>
<section id="p2" hidden><div class="kpis"><div class="kpi"><span class="big" id="kq">0</span><br><small>marmitas vendidas</small></div><div class="kpi"><span class="big" id="kv">R$ 0,00</span><br><small>faturamento</small></div><div class="kpi"><span class="big" id="ka">0</span><br><small>média por dia</small></div><div class="kpi"><span class="big" id="kr">R$ 0,00</span><br><small>a receber</small></div></div><div class="card"><h2 id="ct">Marmitas por dia</h2><div class="chart" id="chart"></div></div></section>
<section id="p3" hidden><div class="card"><h2>Por cliente</h2><p class="empty">Marque os clientes que entram no resumo.</p><div class="chips"><button type="button" id="sa">Marcar todos</button><button type="button" id="sn">Desmarcar todos</button></div><div id="byc"></div><button class="go" id="cp" type="button" style="width:100%;margin-top:12px">Copiar resumo para o WhatsApp</button><button class="go" id="csv" type="button" style="width:100%;margin-top:10px;background:var(--chili)">Baixar planilha (Excel)</button></div></section>
</main><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,parse=s=>{let[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)},esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];let S={e:[]},per='w',SM=new Date().getMonth()+1,SY=new Date().getFullYear(),EX=new Set();try{let r=localStorage.getItem('sdc-marmitas');if(r)S=JSON.parse(r)}catch(e){}if(!Array.isArray(S.e))S.e=[];const save=()=>localStorage.setItem('sdc-marmitas',JSON.stringify(S));function wk(){let t=new Date(),k=(t.getDay()+6)%7,s=new Date(t.getFullYear(),t.getMonth(),t.getDate()-k);return[iso(s),iso(new Date(s.getFullYear(),s.getMonth(),s.getDate()+6))]}function tot(a){return{q:a.reduce((x,e)=>x+(+e.q||0),0),v:a.reduce((x,e)=>x+(+e.q||0)*(+e.v||0),0)}}function toast(m){let t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.remove('on'),2200)}
function render(){let td=iso(new Date()),[ws,we]=wk(),h=tot(S.e.filter(e=>e.d===td)),sem=tot(S.e.filter(e=>e.d>=ws&&e.d<=we));$('#hq').textContent=h.q;$('#hv').textContent=brl(sem.v);let hr=new Date().getHours();$('#hi').textContent=hr<12?'Bom dia!':hr<18?'Boa tarde!':'Boa noite!';let meta=50;$('#gi').style.width=Math.min(100,h.q/meta*100)+'%';$('#gt').textContent=h.q>=meta?'Meta do dia batida! 🎉':`Faltam ${meta-h.q} para a meta de ${meta}`;let wl=S.e.filter(e=>e.d>=ws&&e.d<=we).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);$('#list').innerHTML=wl.length?wl.map(e=>`<div class="row"><div><b>${e.q} marmitas · ${esc(e.c||'Sem cliente')}</b><br><span>${e.d.split('-').reverse().join('/')} · ${brl(e.v)} cada${e.o?' · '+esc(e.o):''}</span></div><div style="text-align:right"><b>${brl(e.q*e.v)}</b><br><button class="pay ${e.p?'ok':''}" data-id="${e.id}" type="button">${e.p?'Pago ✓':'A receber'}</button><button class="del" data-id="${e.id}" type="button">Apagar</button></div></div>`).join(''):'<p class="empty">Nada lançado esta semana.</p>';
let ym=`${SY}-${pad(SM)}`,set,keys,labels;if(per==='w'){set=wl;let s=parse(ws);keys=[...Array(7)].map((_,i)=>iso(new Date(s.getFullYear(),s.getMonth(),s.getDate()+i)));labels=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom']}else if(per==='m'){set=S.e.filter(e=>e.d.startsWith(ym));let n=new Date(SY,SM,0).getDate();keys=[...Array(n)].map((_,i)=>`${ym}-${pad(i+1)}`);labels=keys.map((_,i)=>(i+1)%5===1||i+1===n?i+1:'' )}else{set=S.e;keys=[...new Set(S.e.map(e=>e.d.slice(0,7)))].sort();labels=keys.map(k=>k.slice(5)+'/'+k.slice(2,4))}let g=k=>set.filter(e=>(per==='a'?e.d.slice(0,7):e.d)===k).reduce((x,e)=>x+(+e.q||0),0),vals=keys.map(g),mx=Math.max(...vals,1),T=tot(set);$('#kq').textContent=T.q;$('#kv').textContent=brl(T.v);$('#kr').textContent=brl(set.filter(e=>!e.p).reduce((x,e)=>x+(+e.q||0)*(+e.v||0),0));$('#ka').textContent=new Set(set.map(e=>e.d)).size?Math.round(T.q/new Set(set.map(e=>e.d)).size):0;$('#mp').hidden=per!=='m';$('#sm').innerHTML=MN.map((m,i)=>`<option value="${i+1}" ${i+1===SM?'selected':''}>${m}</option>`).join('');let ys=[...new Set([...S.e.map(e=>+e.d.slice(0,4)),SY,new Date().getFullYear()])].sort((a,b)=>b-a);$('#sy').innerHTML=ys.map(y=>`<option value="${y}" ${y===SY?'selected':''}>${y}</option>`).join('');let bc={};set.forEach(e=>{let k=e.c||'Sem cliente';bc[k]??={q:0,v:0,r:0};bc[k].q+=+e.q||0;bc[k].v+=(+e.q||0)*(+e.v||0);if(e.p)bc[k].r+=(+e.q||0)*(+e.v||0)});let rk=Object.entries(bc).sort((a,b)=>b[1].q-a[1].q);window._rk=rk;$('#cp').textContent=`Copiar resumo (${rk.filter(([k])=>!EX.has(k)).length} de ${rk.length} clientes)`;$('#byc').innerHTML=rk.length?rk.map(([k,x])=>`<div class="row"><div><input type="checkbox" class="ck" data-k="${esc(k)}" ${EX.has(k)?'':'checked'}> <b>${esc(k)}</b><br><span>${x.q} marmitas · recebido ${brl(x.r)}</span></div><b>${brl(x.v)}</b></div>`).join(''):'<p class="empty">Sem lançamentos neste período.</p>';let cm=[...new Map(S.e.filter(e=>e.c).sort((a,b)=>a.id-b.id).map(e=>[e.c,e.v]))];$('#cl').innerHTML=cm.map(([c])=>`<option value="${esc(c)}">`).join('');$('#chips').innerHTML=cm.slice(-6).reverse().map(([c,v])=>`<button type="button" data-c="${esc(c)}" data-v="${v}">${esc(c)}</button>`).join('');$('#ct').textContent=per==='w'?'Marmitas por dia da semana':per==='m'?'Marmitas por dia em '+MN[SM-1]:'Marmitas por mês';$('#chart').innerHTML=vals.map((v,i)=>`<div class="col">${per!=='m'?`<b>${v||''}</b>`:''}<div class="bar" style="height:${v/mx*78}%"></div><span>${labels[i]}</span></div>`).join('')}
let cur=1;function tab(n){cur=n;[1,2,3].forEach(i=>{$('#p'+i).hidden=i!==n;if(i<3)$('#t'+i).setAttribute('aria-selected',i===n)});$('#ctl').hidden=n<2;$('#dp').hidden=true;$('.tabs').dataset.i=n;render();window.scrollTo({top:0,behavior:'smooth'})}$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);$('#mb').onclick=()=>{$('#dp').hidden=!$('#dp').hidden};$('#dp').onclick=e=>{let b=e.target.closest('button');if(b)tab(+b.dataset.n)};$('#seg').onclick=e=>{let b=e.target.closest('button');if(!b)return;document.querySelectorAll('#seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));per=b.dataset.p;render()};$('#sm').onchange=()=>{SM=+$('#sm').value;render()};$('#sy').onchange=()=>{SY=+$('#sy').value;render()};$('#f').onsubmit=e=>{e.preventDefault();let c=$('#c').value.trim(),q=+$('#q').value,v=+$('#v').value,d=$('#d').value,o=$('#o').value.trim();if(!c||q<1||v<=0||!d)return toast('Preencha os campos corretamente.');S.e.push({id:Date.now(),c,q,v,d,o,p:false});save();$('#f').reset();$('#d').value=iso(new Date());render();toast('Lançamento salvo! 🍱')};$('#list').onclick=e=>{let p=e.target.closest('.pay'),d=e.target.closest('.del');if(p){let x=S.e.find(x=>x.id===+p.dataset.id);if(x){x.p=!x.p;save();render()}}if(d){let id=+d.dataset.id;if(confirm('Apagar este lançamento?')){S.e=S.e.filter(x=>x.id!==id);save();render();toast('Lançamento apagado.')}}};$('#chips').onclick=e=>{let b=e.target.closest('button');if(b){$('#c').value=b.dataset.c;$('#v').value=b.dataset.v;$('#q').focus()}};$('#byc').onchange=e=>{let c=e.target.closest('.ck');if(!c)return;c.checked?EX.delete(c.dataset.k):EX.add(c.dataset.k);render()};$('#sa').onclick=()=>{EX.clear();render()};$('#sn').onclick=()=>{EX.clear();(window._rk||[]).forEach(([k])=>EX.add(k));render()};$('#cp').onclick=async()=>{let a=(window._rk||[]).filter(([k])=>!EX.has(k));if(!a.length)return toast('Selecione pelo menos um cliente.');let text=`🍱 RESUMO DAS MARMITAS\n\n${a.map(([k,x])=>`• ${k}: ${x.q} marmitas — ${brl(x.v)}`).join('\n')}\n\n💰 Total: ${brl(a.reduce((s,[k,x])=>s+x.v,0))}`;try{await navigator.clipboard.writeText(text);toast('Resumo copiado! 📋')}catch(e){prompt('Copie o resumo:',text)}};$('#csv').onclick=async()=>{if(typeof ExcelJS==='undefined')return toast('ExcelJS não carregou.');if(!S.e.length)return toast('Não há lançamentos.');let wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Marmitas');ws.columns=[{header:'Data',key:'d',width:14},{header:'Cliente',key:'c',width:30},{header:'Quantidade',key:'q',width:14},{header:'Valor unitário',key:'v',width:18},{header:'Total',key:'t',width:18},{header:'Status',key:'p',width:15},{header:'Observação',key:'o',width:35}];S.e.forEach(e=>ws.addRow({d:e.d.split('-').reverse().join('/'),c:e.c||'Sem cliente',q:e.q,v:e.v,t:e.q*e.v,p:e.p?'Pago':'A receber',o:e.o||''}));ws.getRow(1).font={bold:true};let buf=await wb.xlsx.writeBuffer(),blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='marmitas-da-tiane.xlsx';a.click();URL.revokeObjectURL(url);toast('Planilha baixada! 📊')};$('#d').value=iso(new Date());render();
</script>
</body>
</html>
