<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Marmitas da Tiane</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}.app{max-width:900px;margin:auto}.header{background:#111827;color:#fff;padding:20px 16px;position:sticky;top:0;z-index:5}.row{display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800}.sub{font-size:12px;color:#cbd5e1;margin-top:4px}.menu{background:#374151;color:white;border:0;border-radius:10px;font-size:22px;width:44px;height:44px}.popup{display:none;position:absolute;right:16px;top:72px;background:white;color:#111;border-radius:12px;padding:6px;box-shadow:0 8px 25px #0004;width:210px}.popup.show{display:block}.popup button{display:block;width:100%;padding:12px;text-align:left;border:0;background:white;border-radius:8px}.main{padding:14px;padding-bottom:60px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:white;padding:5px;border-radius:13px;margin-bottom:14px}.tabs button{border:0;background:transparent;padding:13px;border-radius:9px;font-weight:700;color:#6b7280}.tabs .active{background:#111827;color:white}.card{background:white;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #0000000b}.card h2{margin:0 0 14px;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}.field label{display:block;font-size:13px;font-weight:700;color:#4b5563;margin-bottom:5px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font:inherit}.field textarea{min-height:70px}.primary{width:100%;margin-top:12px;padding:14px;border:0;border-radius:11px;background:#16a34a;color:#fff;font-weight:800}.sale{border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin-bottom:9px}.salehead{display:flex;justify-content:space-between;gap:8px}.name{font-weight:800}.meta{font-size:12px;color:#6b7280;margin-top:4px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.status,.del,.filter button{border:0;border-radius:9px;padding:8px 10px;font-weight:700}.status{background:#fef3c7;color:#92400e}.status.paid{background:#dcfce7;color:#166534}.del{background:#fee2e2;color:#b91c1c}.hidden{display:none}.filters{display:flex;gap:7px;margin-bottom:13px}.filter button{background:#e5e7eb;color:#4b5563}.filter .active{background:#111827;color:#fff}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px}.kpi{padding:12px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:11px}.kpi small{display:block;color:#6b7280}.kpi strong{display:block;font-size:19px;margin-top:4px}.empty{text-align:center;color:#6b7280;padding:22px}.chart{height:180px;display:flex;align-items:end;gap:7px;border-bottom:1px solid #ddd;padding:8px 3px}.baritem{flex:1;text-align:center;font-size:10px;color:#6b7280}.bar{background:#111827;border-radius:6px 6px 0 0;min-height:3px;max-width:45px;margin:auto}.client{padding:11px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.client small{display:block;color:#6b7280;margin-top:3px}.secondary{width:100%;padding:12px;margin-top:9px;border:0;border-radius:10px;background:#e5e7eb;font-weight:700}@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.main{padding:11px}}</style></head><body><div class="app"><header class="header"><div class="row"><div><div class="brand">🍱 Marmitas da Tiane</div><div class="sub" id="today"></div></div><button class="menu" id="menub">☰</button></div><div class="popup" id="popup"><button onclick="tab('lancar');closeMenu()">📝 Lançar marmita</button><button onclick="tab('totais');closeMenu()">📊 Totais</button><button onclick="tab('clientes');closeMenu()">👥 Clientes</button><button onclick="backup();closeMenu()">💾 Backup</button><button onclick="restore();closeMenu()">♻️ Restaurar</button></div></header><main class="main"><div class="tabs"><button id="tl" class="active" onclick="tab('lancar')">Lançar marmitas</button><button id="tt" onclick="tab('totais')">Totais</button></div><section id="lancar"><div class="card"><h2>Nova venda</h2><form id="form"><div class="grid"><div class="field full"><label>Cliente</label><input id="client" required placeholder="Nome do cliente"></div><div class="field"><label>Quantidade</label><input id="qty" type="number" min="1" value="1" required></div><div class="field"><label>Preço unitário</label><input id="price" type="number" min="0" step="0.01" required placeholder="15,00"></div><div class="field"><label>Data</label><input id="date" type="date" required></div><div class="field full"><label>Observação</label><textarea id="obs" placeholder="Observação opcional"></textarea></div></div><button class="primary">➕ Registrar venda</button></form></div><div class="card"><h2>Vendas recentes</h2><div id="recent"></div></div></section><section id="totais" class="hidden"><div class="card"><h2>Resumo</h2><div class="filters"><button class="filter active" data-p="week">Semana</button><button class="filter" data-p="month">Mês</button><button class="filter" data-p="all">Tudo</button></div><div class="kpis"><div class="kpi"><small>Marmitas</small><strong id="kq">0</strong></div><div class="kpi"><small>Faturamento</small><strong id="kr">R$ 0,00</strong></div><div class="kpi"><small>Média/dia</small><strong id="kd">R$ 0,00</strong></div><div class="kpi"><small>A receber</small><strong id="ku">R$ 0,00</strong></div></div></div><div class="card"><h2>Faturamento por dia</h2><div class="chart" id="chart"></div></div></section><section id="clientes" class="hidden"><div class="card"><h2>Clientes</h2><div id="clients"></div><button class="secondary" onclick="whats()">📲 Copiar resumo para WhatsApp</button><button class="secondary" onclick="csv()">📥 Baixar CSV</button></div></section></main></div><script>const KEY='marmitas-tiane-v1';let sales=JSON.parse(localStorage.getItem(KEY)||'[]'),period='week',q=s=>document.getElementById(s),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),iso=()=>new Date().toISOString().slice(0,10),esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));q('date').value=iso();q('today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});q('menub').onclick=()=>q('popup').classList.toggle('show');function closeMenu(){q('popup').classList.remove('show')}function save(){localStorage.setItem(KEY,JSON.stringify(sales))}function tab(n){['lancar','totais','clientes'].forEach(x=>q(x).classList.toggle('hidden',x!==n));q('tl').classList.toggle('active',n==='lancar');q('tt').classList.toggle('active',n==='totais');if(n==='lancar')recent();if(n==='totais')totals();if(n==='clientes')clients()}q('form').onsubmit=e=>{e.preventDefault();let s={id:Date.now(),client:q('client').value.trim(),qty:+q('qty').value,price:+q('price').value,date:q('date').value,obs:q('obs').value.trim(),paid:false};if(!s.client||!s.price)return;sales.unshift(s);save();e.target.reset();q('qty').value=1;q('date').value=iso();recent();alert('Venda registrada!')};function recent(){q('recent').innerHTML=sales.length?sales.slice(0,30).map(s=>`<div class="sale"><div class="salehead"><div><div class="name">${esc(s.client)}</div><div class="meta">${s.date.split('-').reverse().join('/')} • ${s.qty} marmita(s)</div></div><b>${money(s.qty*s.price)}</b></div>${s.obs?`<div class="meta">Obs.: ${esc(s.obs)}</div>`:''}<div class="bottom"><button class="status ${s.paid?'paid':''}" onclick="paid(${s.id})">${s.paid?'Pago ✓':'A receber'}</button><button class="del" onclick="del(${s.id})">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhuma venda registrada.</div>'}function paid(id){let s=sales.find(x=>x.id===id);if(s)s.paid=!s.paid;save();recent();totals()}function del(id){if(confirm('Excluir esta venda?')){sales=sales.filter(x=>x.id!==id);save();recent();totals();clients()}}function list(){if(period==='all')return sales;let d=new Date();if(period==='week'){let day=d.getDay()||7;d.setDate(d.getDate()-day+1)}else d.setDate(1);let st=d.toISOString().slice(0,10);return sales.filter(s=>s.date>=st)}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');period=b.dataset.p;totals()});function totals(){let a=list(),qty=a.reduce((x,s)=>x+s.qty,0),rev=a.reduce((x,s)=>x+s.qty*s.price,0),due=a.filter(s=>!s.paid).reduce((x,s)=>x+s.qty*s.price,0),days=new Set(a.map(s=>s.date));q('kq').textContent=qty;q('kr').textContent=money(rev);q('kd').textContent=money(days.size?rev/days.size:0);q('ku').textContent=money(due);let g={};a.forEach(s=>g[s.date]=(g[s.date]||0)+s.qty*s.price);let keys=Object.keys(g).sort().slice(-7),mx=Math.max(...keys.map(k=>g[k]),1);q('chart').innerHTML=keys.length?keys.map(k=>`<div class="baritem"><div>${money(g[k]).replace('R$ ','')}</div><div class="bar" style="height:${Math.max(3,g[k]/mx*125)}px"></div><div>${k.slice(8)}/${k.slice(5,7)}</div></div>`).join(''):'<div class="empty">Sem vendas.</div>'}function clients(){let m={};sales.forEach(s=>{m[s.client]??={qty:0,total:0,due:0};m[s.client].qty+=s.qty;m[s.client].total+=s.qty*s.price;if(!s.paid)m[s.client].due+=s.qty*s.price});let a=Object.entries(m).sort((x,y)=>y[1].total-x[1].total);q('clients').innerHTML=a.length?a.map(([n,v])=>`<div class="client"><div><b>${esc(n)}</b><small>${v.qty} marmita(s) • A receber: ${money(v.due)}</small></div><b>${money(v.total)}</b></div>`).join(''):'<div class="empty">Nenhum cliente.</div>'}function whats(){let m={};sales.forEach(s=>m[s.client]=(m[s.client]||0)+s.qty*s.price);let t='*Marmitas da Tiane - Resumo*\n\n';Object.entries(m).forEach(([n,v])=>t+=`${n}: ${money(v)}\n`);t+='\n*Total: '+money(sales.reduce((a,s)=>a+s.qty*s.price,0))+'*';navigator.clipboard?.writeText(t).then(()=>alert('Resumo copiado!')).catch(()=>alert(t))}function csv(){let c='Cliente;Quantidade;Preço;Total;Data;Pago;Observação\n';sales.forEach(s=>c+=`"${s.client}";${s.qty};${s.price.toFixed(2)};${(s.qty*s.price).toFixed(2)};${s.date};${s.paid?'Sim':'Não'};"${s.obs||''}"\n`);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download='marmitas-da-tiane.csv';a.click()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(sales,null,2)],{type:'application/json'}));a.download='backup-marmitas-tiane.json';a.click()}function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;sales=d;save();recent();totals();clients();alert('Backup restaurado!')}catch{alert('Backup inválido.')}};r.readAsText(e.target.files[0])};i.click()}recent();</script></body></html>
